<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boss Rig Review</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #12191b; --panel: rgba(16, 24, 27, .92); --line: #2c3b40; --text: #dfe8ea; --dim: #8fa3a8; --accent: #f0a23a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font: 15px/1.35 system-ui, "Segoe UI", sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
      #card { position: fixed; top: 12px; left: 12px; width: 260px; padding: 14px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; }
      #card h2 { margin: 0; font-size: 22px; }
      #card .id { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
      h3 { margin: 14px 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
      #clips { display: grid; gap: 6px; }
      button { padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; background: #1b2629; color: var(--text);
        font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
      button.on { border-color: var(--accent); color: var(--accent); }
      .row { display: flex; gap: 6px; } .row button { flex: 1; text-align: center; }
      label { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 6px; }
      input[type=range] { flex: 1; }
      .note { margin-top: 12px; color: var(--dim); font-size: 12px; }
      #status { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: var(--dim); font-size: 13px; }
      @media (max-width: 760px) { #card { top: auto; bottom: 12px; right: 12px; width: auto; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="card">
      <h2>Nihilister</h2>
      <div class="id">mba002 · hand rig, placeholder motion</div>
      <h3>Animation</h3>
      <div id="clips"></div>
      <h3>Playback</h3>
      <div class="row"><button id="play">Pause</button><button id="bones">Bones</button></div>
      <label>Speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" /><span id="speedv">1.0×</span></label>
      <label>Frame <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" /></label>
      <div class="note">Drag to orbit, wheel to zoom. Motion is a guess, not game data.</div>
    </div>
    <div id="status">Loading…</div>
    <script type="module">
      import { ArcRotateCamera, Color4, DirectionalLight, Engine, HemisphericLight, MeshBuilder, Scene, SkeletonViewer, StandardMaterial, Color3, Vector3, SceneLoader } from '@babylonjs/core';
      import '@babylonjs/loaders/glTF';

      const canvas = document.getElementById('view');
      const engine = new Engine(canvas, true);
      const scene = new Scene(engine);
      scene.clearColor = new Color4(.07, .1, .11, 1);
      const cam = new ArcRotateCamera('cam', Math.PI / 4, 1.15, 60, new Vector3(0, 8, -4), scene);
      cam.attachControl(canvas, true); cam.wheelPrecision = 8; cam.lowerRadiusLimit = 15; cam.upperRadiusLimit = 200;
      new HemisphericLight('sky', new Vector3(.2, 1, .3), scene).intensity = 1.1;
      new DirectionalLight('sun', new Vector3(-.4, -1, -.5), scene).intensity = 1.2;
      const ground = MeshBuilder.CreateGround('ground', { width: 80, height: 80 }, scene);
      ground.position.y = -6; ground.material = Object.assign(new StandardMaterial('g', scene), { diffuseColor: new Color3(.13, .17, .18), specularColor: Color3.Black() });

      const status = document.getElementById('status');
      const { animationGroups: groups, skeletons, meshes } = await SceneLoader.ImportMeshAsync('', '/raw/bosses/', 'mba002_nihilister_rigged.glb', scene);
      status.textContent = '';
      let current, playing = true, speed = 1, viewer;
      const box = document.getElementById('clips');
      function select(g) {
        groups.forEach((x) => x.stop());
        current = g; g.start(true, speed); if (!playing) g.pause();
        box.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.textContent === g.name.replace(/_/g, ' ')));
      }
      for (const g of groups) {
        const b = document.createElement('button'); b.textContent = g.name.replace(/_/g, ' ');
        b.onclick = () => select(g); box.append(b);
      }
      select(groups[0]);

      document.getElementById('play').onclick = (e) => {
        playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play';
        playing ? current.play(true) : current.pause();
      };
      document.getElementById('speed').oninput = (e) => {
        speed = +e.target.value; current.speedRatio = speed; document.getElementById('speedv').textContent = speed.toFixed(1) + '×';
      };
      const scrub = document.getElementById('scrub');
      scrub.oninput = () => {
        if (playing) document.getElementById('play').click();
        current.goToFrame(current.from + (current.to - current.from) * +scrub.value);
      };
      document.getElementById('bones').onclick = (e) => {
        if (viewer) { viewer.dispose(); viewer = null; } else {
          const mesh = meshes.find((m) => m.skeleton);
          viewer = new SkeletonViewer(skeletons[0], mesh, scene, false, 3, { displayMode: SkeletonViewer.DISPLAY_SPHERE_AND_SPURS });
        }
        e.target.classList.toggle('on', !!viewer);
      };
      scene.onBeforeRenderObservable.add(() => {
        if (playing && current?.animatables[0]) {
          const f = current.animatables[0].masterFrame;
          scrub.value = ((f - current.from) / (current.to - current.from)) % 1;
        }
      });
      engine.runRenderLoop(() => scene.render());
      addEventListener('resize', () => engine.resize());
    </script>
  </body>
