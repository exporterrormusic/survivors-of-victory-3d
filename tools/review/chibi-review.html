<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chibi Review</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #12191b; color: #dfe8ea; font: 14px/1.35 system-ui, "Segoe UI", sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
      #panel { position: fixed; top: 12px; left: 12px; display: grid; gap: 8px; padding: 12px; width: 240px; background: rgba(16, 24, 27, .92); border: 1px solid #2c3b40; border-radius: 8px; }
      #panel select { width: 100%; padding: 4px; background: #1d292d; color: inherit; border: 1px solid #2c3b40; }
      #status { color: #8fa3a8; font-size: 12px; }
      #status.error { color: #ff8a80; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <b>Chibi review</b>
      <label>Model <select id="variant"></select></label>
      <label>Clip <select id="clip"></select></label>
      <span id="status">Loading…</span>
    </div>
    <!-- Dev-only page (npm run dev, then /tools/review/chibi-review.html). Not part of the game build. -->
    <script>
      // The review script is TypeScript that only the Vite dev server can run. Say why instead of
      // showing "Loading…" forever: opened another way, or an error while loading.
      const fail = (text) => { const s = document.getElementById('status'); s.textContent = text; s.classList.add('error'); };
      const devUrl = 'http://localhost:5173/tools/review/chibi-review.html';
      addEventListener('error', (e) => fail(`Review page error: ${e.message}`));
      addEventListener('unhandledrejection', (e) => fail(`Review page error: ${e.reason?.message ?? e.reason}`));
      if (location.protocol === 'file:') fail(`Opened as a file. Run npm run dev, then open ${devUrl}`);
      else setTimeout(() => { if (!window.reviewStarted) fail(`The review script didn't start. Run npm run dev, then open ${devUrl}`); }, 8000);
    </script>
    <script type="module" src="/src/review/chibi-review.ts"></script>
  </body>
</html>
