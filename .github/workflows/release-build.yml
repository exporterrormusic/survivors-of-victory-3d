# Every push to main builds the Windows installer and publishes it as the latest GitHub release,
# numbered after the last one: RELEASE_VERSION "0.1" gives 0.1.0, 0.1.1, 0.1.2 ... and bumping it to
# "0.2" starts again at 0.2.0. Installed copies pick each one up through the auto-updater.
name: Release build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'tools/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp the build number
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/RELEASE_VERSION\s*=\s*\"([\d.]+)\"/)[1]")
          last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep -E "^v${base//./\.}\.[0-9]+$" || true; } | sed 's/.*\.//' | sort -n | tail -1)
          node tools/sync-version.mjs --build $(( ${last:--1} + 1 ))
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          VITE_GAME_VERSION: ${{ steps.version.outputs.version }}

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          gh release create "v$VERSION" \
            "SurvivorsOfVictory-Setup-$VERSION.exe" \
            "SurvivorsOfVictory-Setup-$VERSION.exe.blockmap" \
            latest.yml \
            --latest --target "$GITHUB_SHA" \
            --title "Survivors of Victory 3D v$VERSION" \
            --notes "Build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

      # Each installer is ~750 MB; keep only the five newest numbered builds.
      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
